<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet -->
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Maptiler -->
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.1.0/maptiler-sdk.umd.min.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.1.0/maptiler-sdk.css" rel="stylesheet" />
    <script src="https://cdn.maptiler.com/leaflet-maptilersdk/v4.1.0/leaflet-maptilersdk.umd.min.js"></script>
    <!-- /Maptiler -->
    <!-- Lucid Icons -->
    <script src="https://unpkg.com/lucide@1.43.0"></script>
    <title>Recycle Map</title>
</head>
<body>
    <header>
        <h1>Recycle Map</h1>
    </header>
    <main>
        <div id="map"></div>
        <search>
            <form>
                <div class="input-wrapper">
                    <input
                    id="combobox" 
                    type="search"
                    name="search"
                    placeholder="O que você quer descartar hoje?"
                    aria-label="Search through site content"
                    list="cars">
                    <i data-lucide="search"></i>
                </div>
                <div id="search-result">
                    <ul>
                        <li class="search-result-item">
                            <div class="avatar-icon">
                                <i data-lucide="recycle"></i>
                            </div>
                            <div class="content">
                                <p class="text-body">Title</p>
                                <p class="text-description">Description</p>
                            </div>
                        </li>
                    </ul>

                </div>
            </form>
        </search>
    </main>
    <footer>
        Designed and coded by <a href="https://github.com/sabrigs">Sabrina Silva</a>
    </footer>
        
    <script src="js/script.js"></script>
</body>
</html>
